und:#061b1e;color:#f2fffd;padding:12px;font:inherit;outline:none}input:focus,select:focus{border-color:var(--mint);box-shadow:0 0 0 3px #43f3c822}label{font-size:12px;color:var(--muted);display:block;margin:9px 0 5px}.searchrow{display:flex;gap:8px;margin:10px 0}.searchrow input{flex:1}.empty{text-align:center;padding:26px 12px;color:var(--muted);border:1px dashed #2a5d59;border-radius:16px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions .btn{flex:1}.pill{font-size:10px;color:var(--mint);background:#16433e;padding:4px 7px;border-radius:20px}.notice{position:fixed;z-index:20;left:50%;bottom:86px;transform:translateX(-50%);background:#d4fff2;color:#04221b;padding:11px 16px;border-radius:13px;font-weight:700;box-shadow:0 8px 30px #0007;max-width:90vw}.modal{position:fixed;z-index:30;inset:0;background:#0009;display:grid;place-items:end center;padding:12px}.modalbox{width:min(100%,560px);max-height:88vh;overflow:auto;background:#0a2427;border:1px solid #2a7168;border-radius:24px;padding:19px;box-shadow:0 20px 70px #0009}.modalbox h2{margin:0 0 10px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hidden{display:none!important}.footer{text-align:center;color:#628b88;font-size:10px;padding:25px 0 10px}@media(min-width:650px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.modal{place-items:center}.hero h1{font-size:34px}}
</style></head><body><header><div class="logo">S</div><div><div class="brand">SPARLAY 🌺</div><div class="tag">SMART SHOP • BETTER BUSINESS</div></div><div class="header-right">● LOCAL MODE</div></header><main class="wrap"><div id="app"></div><div class="footer">SPARLAY 🌺 · Shop smarter, grow faster · Your data stays on this device</div></main><nav class="tabs"><button class="tab active" data-tab="Home"><b>⌂</b>Home</button><button class="tab" data-tab="Products"><b>▦</b>Products</button><button class="tab" data-tab="Sales"><b>▣</b>Sales</button><button class="tab" data-tab="Expenses"><b>↘</b>Expenses</button><button class="tab" data-tab="Reports"><b>▥</b>Reports</button></nav><div id="modal-root"></div><script>
const KEY='sparlay-shop-v1';let state={products:[],sales:[],expenses:[],settings:{shop:'SPARLAY 🌺',currency:'Rs.'}};let tab='Home',query='';try{state={...state,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{};const money=n=>`${state.settings.currency||'Rs.'} ${Number(n||0).toLocaleString('en-PK',{minimumFractionDigits:2,maximumFractionDigits:2})}`;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>{localStorage.setItem(KEY,JSON.stringify(state));render()};const todayStart=()=>{let d=new Date();d.setHours(0,0,0,0);return d.getTime()};const todaySales=()=>state.sales.filter(s=>s.time>=todayStart()).reduce((a,s)=>a+s.total,0);const todayExpenses=()=>state.expenses.filter(e=>e.time>=todayStart()).reduce((a,e)=>a+e.amount,0);const profit=()=>state.sales.reduce((a,s)=>a+s.items.reduce((b,i)=>b+(i.price-i.cost)*i.qty,0),0)-state.expenses.reduce((a,e)=>a+e.amount,0);function notice(t){let el=document.createElement('div');el.className='notice';el.textContent=t;document.body.append(el);setTimeout(()=>el.remove(),2400)}function card(label,value,icon){return `<div class="card"><div class="metric-label">${icon||'✦'} ${label}</div><div class="metric">${value}</div></div>`}function empty(title,sub){return `<div class="empty"><div style="font-size:30px;margin-bottom:7px">🌺</div><b>${title}</b><div class="small" style="margin-top:5px">${sub}</div></div>`}function productRows(){let list=state.products.filter(p=>(p.name+' '+p.sku).toLowerCase().includes(query.toLowerCase()));return list.length?`<div class="list">${list.map(p=>`<div class="item"><div class="item-icon">▦</div><div class="item-main"><div class="item-title">${esc(p.name)}</div><div class="small">SKU: ${esc(p.sku||'—')} · Cost ${money(p.cost)} · Stock ${p.stock}</div></div><div class="right"><div class="price">${money(p.price)}</div><div class="small">${p.stock<=p.min?'LOW STOCK':'In stock'}</div><button class="btn secondary" style="padding:5px 9px;margin-top:5px" onclick="editProduct(${p.id})">Edit</button></div></div>`).join('')}</div>`:empty('No products yet','Add your first product to start managing inventory.')}function saleRows(){return state.sales.length?`<div class="list">${[...state.sales].reverse().map(s=>`<div class="item"><div class="item-icon">▣</div><div class="item-main"><div class="item-title">${esc(s.invoice)}</div><div class="small">${new Date(s.time).toLocaleString()} · ${esc(s.method)} · ${s.items.length} line(s)</div></div><div class="right"><div class="price">${money(s.total)}</div><button class="btn secondary" style="padding:5px 9px;margin-top:5px" onclick="receipt('${s.id}')">Receipt</button></div></div>`).join('')}</div>`:empty('No sales recorded','Create a sale to generate an invoice and update stock.')}function expenseRows(){return state.expenses.length?`<div class="list">${[...state.expenses].reverse().map(e=>`<div class="item"><div class="item-icon">↘</div><div class="item-main"><div class="item-title">${esc(e.title)}</div><div class="small">${new Date(e.time).toLocaleString()} · ${esc(e.category)}</div></div><div class="price">${money(e.amount)}</div></div>`).join('')}</div>`:empty('No expenses','Record rent, utilities, transport or other shop costs.')}function render(){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));let app=document.getElementById('app');if(tab==='Home')app.innerHTML=`<section class="hero"><div class="eyebrow">YOUR BUSINESS, IN CONTROL</div><h1>Welcome to<br><span class="mint">SPARLAY 🌺</span></h1><p>Run your shop from one beautiful place.</p><button class="btn" onclick="setTab('Products')">＋ Add products</button> <button class="btn secondary" onclick="openSale()">＋ New sale</button></section><div class="grid">${card("Today's sales",money(todaySales()),'↗')}${card("Today's expenses",money(todayExpenses()),'↘')}${card('Products',state.products.length,'▦')}${card('Low stock',state.products.filter(p=>p.stock<=p.min).length,'⚠')}</div><div class="section-head"><h2>Business snapshot</h2><span class="pill">LIVE LOCAL DATA</span></div><div class="grid">${card('Total invoices',state.sales.length,'▣')}${card('Total expenses',money(state.expenses.reduce((a,e)=>a+e.amount,0)),'−')}${card('Estimated profit',money(profit()),'✦')}${card('Stock cost value',money(state.products.reduce((a,p)=>a+p.cost*p.stock,0)),'◇')}</div><div class="section-head"><h2>Recent sales</h2><button class="btn secondary" onclick="setTab('Sales')">View all</button></div>${state.sales.length?saleRows().split('<div class="list">')[1]?.replace(/<\/div>$/,'')?`<div class="list">${[...state.sales].reverse().slice(0,3).map(s=>`<div class="item"><div class="item-icon">▣</div><div class="item-main"><div class="item-title">${esc(s.invoice)}</div><div class="small">${new Date(s.time).toLocaleString()}</div></div><div class="price">${money(s.total)}</div></div>`).join('')}</div>`:empty('No sales','Your latest sales will appear here.'):empty('No sales yet','Record your first sale when you are ready.')}`;
else if(tab==='Products')app.innerHTML=`<div class="section-head"><h2>Products & inventory</h2><button class="btn" onclick="openProduct()">＋ Add</button></div><div class="searchrow"><input placeholder="Search product or SKU" value="${esc(query)}" oninput="query=this.value;const y=window.scrollY;render();window.scrollTo(0,y)"></div>${productRows()}`;
else if(tab==='Sales')app.innerHTML=`<div class="section-head"><h2>Sales & invoices</h2><button class="btn" onclick="openSale()">＋ New sale</button></div><div class="grid">${card('Sales today',money(todaySales()),'↗')}${card('Invoices',state.sales.length,'▣')}</div>${saleRows()}`;
else if(tab==='Expenses')app.innerHTML=`<div class="section-head"><h2>Shop expenses</h2><button class="btn" onclick="openExpense()">＋ Add</button></div><div class="grid">${card('Today',money(todayExpenses()),'↘')}${card('All expenses',money(state.expenses.reduce((a,e)=>a+e.amount,0)),'−')}</div>${expenseRows()}`;
else app.innerHTML=`<div class="section-head"><h2>Reports & analytics</h2><button class="btn secondary" onclick="exportData()">Export JSON</button></div><div class="grid">${card('Today sales',money(todaySales()),'↗')}${card('Today expenses',money(todayExpenses()),'↘')}${card('Gross product profit',money(state.sales.reduce((a,s)=>a+s.items.reduce((b,i)=>b+(i.price-i.cost)*i.qty,0),0)),'✦')}${card('Estimated net profit',money(profit()),'◇')}</div><div class="card"><b>Inventory valuation</b><p class="muted">Cost value: <span class="mint">${money(state.products.reduce((a,p)=>a+p.cost*p.stock,0))}</span></p><p class="muted">Retail value: <span class="mint">${money(state.products.reduce((a,p)=>a+p.price*p.stock,0))}</span></p><p class="small">Profit is an estimate from recorded sale-item costs less recorded expenses; returns, taxes, credit settlements and supplier balances are not included in this starter edition.</p></div><div class="section-head"><h2>Data management</h2></div><div class="card"><p class="muted">Your data is stored locally in this browser on this phone. Export backups regularly; clearing browser data may remove records.</p><div class="actions"><button class="btn secondary" onclick="exportData()">Backup data</button><button class="btn secondary" onclick="document.getElementById('importFile').click()">Restore backup</button><input id="importFile" type="file" accept="application/json" class="hidden" onchange="importData(event)"></div><div class="actions"><button class="btn danger" onclick="clearRecords()">Clear business records</button></div></div>`}function setTab(t){tab=t;query='';render();window.scrollTo(0,0)}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));function modal(title,body,saveText,callback){let root=document.getElementById('modal-root');root.innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="modalbox"><h2>${title}</h2>${body}<div class="actions"><button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn" id="modalSave">${saveText}</button></div></div></div>`;document.getElementById('modalSave').onclick=callback}function closeModal(){document.getElementById('modal-root').innerHTML=''}function val(id){return document.getElementById(id)?.value?.trim()??''}function openProduct(existing=null){let p=existing||{};modal(existing?'Edit product':'Add product',`<label>Product name *</label><input id="pname" value="${esc(p.name||'')}" placeholder="e.g. USB Cable"><div class="two"><div><label>SKU / barcode</label><input id="psku" value="${esc(p.sku||'')}" placeholder="Optional"></div><div><label>Category</label><input id="pcat" value="${esc(p.category||'General')}" placeholder="General"></div></div><div class="two"><div><label>Cost price (PKR) *</label><input id="pcost" type="number" min="0" step="0.01" value="${p.cost??''}"></div><div><label>Sale price (PKR) *</label><input id="pprice" type="number" min="0" step="0.01" value="${p.price??''}"></div></div><div class="two"><div><label>Stock quantity *</label><input id="pstock" type="number" min="0" step="1" value="${p.stock??0}"></div><div><label>Low-stock alert at</label><input id="pmin" type="number" min="0" step="1" value="${p.min??3}"></div></div>`, 'Save product',()=>{let name=val('pname'),cost=Number(val('pcost')),price=Number(val('pprice')),stock=Number(val('pstock')),min=Number(val('pmin'));if(!name||val('pcost')===''||val('pprice')===''||![cost,price,stock,min].every(Number.isFinite)||cost<0||price<0||stock<0||min<0||!Number.isInteger(stock)||!Number.isInteger(min)){notice('Please enter valid product details');return}let item={id:p.id||Date.now(),name,sku:val('psku'),category:val('pcat')||'General',cost,price,stock,min};if(existing)state.products=state.products.map(x=>x.id===p.id?item:x);else state.products.push(item);closeModal();save();notice('Product saved on this device')})}function editProduct(id){let p=state.products.find(x=>x.id===id);if(p)openProduct(p)}function openSale(){if(!state.products.length){notice('Add a product first');setTab('Products');return}let options=state.products.map(p=>`<option value="${p.id}">${esc(p.name)} — ${money(p.price)} (stock ${p.stock})</option>`).join('');modal('Create sale',`<label>Product *</label><select id="sproduct" onchange="updateSaleTotal()">${options}</select><div class="two"><div><label>Quantity *</label><input id="sqty" type="number" min="1" step="1" value="1" oninput="updateSaleTotal()"></div><div><label>Payment method</label><select id="smethod"><option>Cash</option><option>Easypaisa</option><option>JazzCash</option><option>Bank</option><option>Credit</option></select></div></div><label>Discount (PKR)</label><input id="sdiscount" type="number" min="0" step="0.01" value="0" oninput="updateSaleTotal()"><div class="card" style="margin-top:12px"><span class="muted">Invoice total</span><div class="metric mint" id="saleTotal">—</div></div>`, 'Confirm sale',()=>{let p=state.products.find(x=>x.id===Number(val('sproduct'))),qty=Number(val('sqty')),discount=Number(val('sdiscount'));if(!p||!Number.isInteger(qty)||qty<1||qty>p.stock||!Number.isFinite(discount)||discount<0||discount>p.price*qty){notice('Check quantity, stock and discount');return}let total=Math.round((p.price*qty-discount)*100)/100;let s={id:Date.now(),invoice:'SP-'+Date.now().toString().slice(-8),time:Date.now(),total,paid:val('smethod')==='Credit'?0:total,method:val('smethod'),discount,items:[{productId:p.id,name:p.name,qty,price:p.price,cost:p.cost}]};p.stock-=qty;state.sales.push(s);closeModal();save();notice('Sale saved · '+s.invoice);});updateSaleTotal()}function updateSaleTotal(){let p=state.products.find(x=>x.id===Number(val('sproduct'))),q=Number(val('sqty')||1),d=Number(val('sdiscount')||0),el=document.getElementById('saleTotal');if(el&&p)el.textContent=money(Math.max(0,p.price*q-d))}function openExpense(){modal('Add expense',`<label>Expense title *</label><input id="etitle" placeholder="e.g. Electricity bill"><div class="two"><div><label>Amount (PKR) *</label><input id="eamount" type="number" min="0.01" step="0.01" placeholder="0.00"></div><div><label>Category</label><select id="ecat"><option>General</option><option>Rent</option><option>Utilities</option><option>Transport</option><option>Salary</option><option>Maintenance</option><option>Other</option></select></div></div>`, 'Save expense',()=>{let title=val('etitle'),amount=Number(val('eamount'));if(!title||!Number.isFinite(amount)||amount<=0){notice('Enter a title and valid amount');return}state.expenses.push({id:Date.now(),title,amount,category:val('ecat'),time:Date.now()});closeModal();save();notice('Expense saved')})}function receipt(id){let s=state.sales.find(x=>String(x.id)===String(id));if(!s)return;let html=`<html><head><meta name="viewport" content="width=device-width"><title>${s.invoice}</title><style>body{font:15px Arial;padding:22px;color:#111}h1{margin-bottom:2px}hr{border:0;border-top:1px dashed #888}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:8px 2px;border-bottom:1px solid #ddd}.r{text-align:right}</style></head><body><h1>SPARLAY 🌺</h1><p>SMART SHOP • BETTER BUSINESS</p><hr><b>Invoice:</b> ${s.invoice}<br><b>Date:</b> ${new Date(s.time).toLocaleString()}<br><b>Payment:</b> ${esc(s.method)}<hr><table><tr><th>Item</th><th>Qty</th><th class="r">Amount</th></tr>${s.items.map(i=>`<tr><td>${esc(i.name)}</td><td>${i.qty}</td><td class="r">${money(i.price*i.qty)}</td></tr>`).join('')}</table><hr><p class="r">Discount: ${money(s.discount||0)}</p><h2 class="r">TOTAL: ${money(s.total)}</h2><p>Thank you for shopping with us!</p><button onclick="window.print()">Print / Save PDF</button></body></html>`;let w=window.open('','_blank');if(!w){notice('Allow popups to print receipt');return}w.document.write(html);w.document.close()}function exportData(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='sparlay-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href);notice('Backup export started')}function importData(e){let file=e.target.files[0];if(!file)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!Array.isArray(d.products)||!Array.isArray(d.sales)||!Array.isArray(d.expenses))throw Error();if(confirm('Replace current records with this backup?')){state=d;save();notice('Backup restored')}}catch{notice('Invalid SPARLAY backup file')}};r.readAsText(file)}function clearRecords(){if(confirm('Clear all products, sales and expenses from this browser? Export a backup first if needed.')){state.products=[];state.sales=[];state.expenses=[];save();notice('Records cleared')}}if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});render();
</script></body></html>
